[package]
name = "tiger"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Read-only, up-to-date copies of other repos inside your project, so agents can read the source instead of guessing"
repository = "https://github.com/mareszhar/tiger"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.17"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
